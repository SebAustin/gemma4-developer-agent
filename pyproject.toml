[project]
name = "g4agent"
version = "0.1.0"
description = "Tooling for the Kaggle Gemma 4 Developer Agent competition: bundle validation, packaging, dev splits, result analysis."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "swegemma",
    "adk-submission",
    "adk-eval-core",
    "google-adk==1.36.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
g4 = "g4agent.cli:main"

[tool.uv.sources]
# Harness wheels are not on PyPI; fetch them with scripts/fetch_harness.sh (Kaggle dataset
# metric/gemma-4-developer-agent-wheelhouse) into vendor/wheelhouse/.
swegemma = { path = "vendor/wheelhouse/swegemma-0.2.7-py3-none-any.whl" }
adk-submission = { path = "vendor/wheelhouse/adk_submission-0.2.11-py3-none-any.whl" }
adk-eval-core = { path = "vendor/wheelhouse/adk_eval_core-0.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g4agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
